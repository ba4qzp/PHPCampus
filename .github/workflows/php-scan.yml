name: PHP 全项目语法扫描

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: 扫描所有 PHP 文件
        run: |
          set -e
          error_files=""
          while IFS= read -r -d '' file; do
            if ! php -l "$file" > /tmp/lint.out 2>&1; then
              echo "::error file=$file::语法错误"
              cat /tmp/lint.out
              error_files="$error_files $file"
            fi
          done < <(find . -name '*.php' -not -path './vendor/*' -print0)

          if [ -n "$error_files" ]; then
            echo ""
            echo "❌ 以下文件存在语法错误（文件被破坏/重复粘贴）："
            for f in $error_files; do echo "  - $f"; done
            exit 1
          fi
          echo "✅ 所有 PHP 文件语法正常"
